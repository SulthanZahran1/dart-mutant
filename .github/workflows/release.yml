name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive (Linux/macOS)
        if: matrix.suffix == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dart_mutant dist/
          tar czf dist/dart_mutant-${{ matrix.target }}.tar.gz -C dist dart_mutant

      - name: Prepare archive (Windows)
        if: matrix.suffix == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dart_mutant.exe dist/
          cd dist && 7z a dart_mutant-${{ matrix.target }}.zip dart_mutant.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dart_mutant-*
          generate_release_notes: true
