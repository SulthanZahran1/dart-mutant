name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static musl build — no glibc dependency, runs on any Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: tar.gz
            setup: |
              sudo apt-get update && sudo apt-get install -y musl-tools
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install target prerequisites
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: matrix.suffix == 'tar.gz'
        run: |
          strip target/${{ matrix.target }}/release/dart_mutant || true

      - name: Prepare archive (Linux/macOS)
        if: matrix.suffix == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dart_mutant dist/
          tar czf dist/dart_mutant-${{ matrix.target }}.tar.gz -C dist dart_mutant

      - name: Prepare archive (Windows)
        if: matrix.suffix == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dart_mutant.exe dist/
          cd dist && 7z a dart_mutant-${{ matrix.target }}.zip dart_mutant.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dart_mutant-*
          generate_release_notes: true

  # GOAL-1.0 criterion 7: publish all workspace crates to crates.io on tag.
  # Publishes in dependency order: core first, then the crates that depend on
  # it, the CLI binary last. Each `cargo publish -p <crate>` resolves its
  # workspace deps against crates.io, so every dependency must already be
  # published before the dependent crate.
  #
  # HUMAN TASK: set the CARGO_REGISTRY_TOKEN secret in repo settings
  # (Settings → Secrets and variables → Actions). It must be a crates.io API
  # token with publish-new + publish-update scopes. Until it's set, this job
  # fails with "no token found" — that's the milestone's known human step.
  publish-crates:
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish dart-mutant-core
        run: cargo publish -p dart-mutant-core

      - name: Publish dart-mutant-runner
        run: cargo publish -p dart-mutant-runner

      - name: Publish dart-mutant-report
        run: cargo publish -p dart-mutant-report

      - name: Publish dart-mutant-tce
        run: cargo publish -p dart-mutant-tce

      - name: Publish dart-mutant (CLI)
        run: cargo publish -p dart-mutant
