[workspace]
resolver = "2"
members = [
    "crates/dart-mutant",
    "crates/dart-mutant-core",
    "crates/dart-mutant-runner",
    "crates/dart-mutant-report",
    "crates/dart-mutant-tce",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sulthan Zahran <sulthan@zahranm.cloud>"]
repository = "https://github.com/SulthanZahran1/dart-mutant"
homepage = "https://github.com/SulthanZahran1/dart-mutant"
description = "AST-based mutation testing for Dart and Flutter"
keywords = ["mutation-testing", "dart", "flutter", "testing", "code-quality"]
categories = ["development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
dart-mutant-core = { path = "crates/dart-mutant-core", version = "0.1.0" }
dart-mutant-runner = { path = "crates/dart-mutant-runner", version = "0.1.0" }
dart-mutant-report = { path = "crates/dart-mutant-report", version = "0.1.0" }
dart-mutant-tce = { path = "crates/dart-mutant-tce", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rayon = "1.10"
walkdir = "2.5"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
